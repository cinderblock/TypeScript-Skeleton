name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # bun runs install + tests
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      # npm-only: provenance signing + trusted-publishing OIDC exchange.
      # Trusted Publishing needs npm CLI 11.5.1+; Node 22 LTS ships with 10.x.
      # Do NOT pass registry-url to setup-node — its placeholder authToken
      # blocks the OIDC exchange.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install -g npm@latest
      # Auth via npm Trusted Publishing (OIDC). Configure on npmjs.com first:
      # https://www.npmjs.com/package/<your-package>/access → Trusted Publisher
      # → GitHub Actions / <user> / <repo> / publish.yml / (no environment).
      - run: npm publish --provenance --access public
